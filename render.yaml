services:
  - type: web
    name: ki-premium-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python Kai.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ABA_API_KEY
        sync: false
      - key: ABA_MERCHANT_ID
        sync: false
      - key: STORE_NAME
        value: "ZEN PREMIUM"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: ki-bot-data
      mountPath: /var/data
      sizeGB: 1
